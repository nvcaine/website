<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta
            name="description"
            content="Personal website of Full-Stack Developer Romuald Halasz"
        />
        <meta name="next-size-adjust" />
        <link rel="icon" href="/icon" type="image/png" sizes="32x32" />

        <title>Romi Halasz</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />

        <style>
            :root {
                --foreground-rgb: 255, 255, 255;
                --background-start-rgb: 50, 50, 50;
                --background-end-rgb: 20, 20, 20;
            }
            html {
                font-family: ui-sans-serif, system-ui, sans-serif;
            }
            html,
            body {
                height: 100%;
                margin: 0;
                padding: 0;
                width: 100%;
            }
            body {
                color: rgb(var(--foreground-rgb));
                background: linear-gradient(
                        to bottom,
                        transparent 0px,
                        rgb(var(--background-end-rgb)) 800px
                    )
                    rgb(var(--background-start-rgb));
            }
            nav {
                border-bottom: 1px solid rgb(75, 85, 99);
                min-height: 4rem;
                top: 0;
            }
            footer {
                border-top: 1px solid rgb(75, 85, 99);
                bottom: 0;
                height: 50px;
                line-height: 50px;
                text-align: center;
            }
            nav,
            footer {
                background-color: rgb(31, 41, 55);
                position: fixed;
                width: 100%;
            }
            main {
                padding-top: 4rem;
                text-align: center;
            }
            h1 {
                font-size: 1.295rem;
                font-family: 'Inter', sans-serif;
                font-optical-sizing: auto;
                font-style: normal;
                font-weight: 355;
                line-height: 1.75rem;
                margin-bottom: 1rem;
                margin-top: 1rem;
            }
            p {
                font-size: 1.05rem;
                margin: 0;
                padding-bottom: 1rem;
                padding-top: 1rem;
            }
        </style>
    </head>

    <body>
        <nav></nav>

        <main>
            <div>
                <h1>Access to this resource has been denied</h1>
                <p>You are not authorised to request this resource.</p>
            </div>
        </main>

        <footer>
            <span>&copy 2026 Romuald Halasz</span>
        </footer>
    </body>
</html>
